# Draait MarketPilot in de cloud (GitHub Actions). Meldingen gaan naar je telefoon via ntfy.
# Zet het ntfy-onderwerp als geheim of variabele NTFY_TOPIC (Settings > Secrets and variables > Actions).
#
# GitHub voert "schedule" maar af en toe uit (vaak uren te laat of helemaal niet). Daarom draait er een
# keten: elke run checkt elke minuut (alleen binnen de sessies doet hij echt iets) en start na ~5u40
# zichzelf opnieuw. Starten of herstarten: Actions > MarketPilot > Run workflow.
# De schedule hieronder is alleen een reserve die de keten weer opstart als die ooit stopt.
# De bestandsnaam tradingstrategie.yml en de concurrency-groep 'tradingstrategie' blijven bewust zo: de keten
# start zichzelf via deze bestandsnaam, en een nieuwe groepsnaam zou tijdens de overgang twee ketens tegelijk toelaten.
name: MarketPilot

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Testmelding sturen (en de keten starten)"
        type: boolean
        default: true

permissions:
  contents: write  # alleen voor de branch "live" met status.json (het dashboard leest die)
  actions: write   # nodig om zichzelf opnieuw te starten

# Eén keten tegelijk. Testruns krijgen een eigen groep, zodat ze niet uren achter de keten wachten.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify && format('test-{0}', github.run_id) || 'tradingstrategie' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Onderdelen installeren
        run: pip install -r requirements.txt

      # Onthoudt welke meldingen al verstuurd zijn, zodat je er niet twee keer een krijgt
      - uses: actions/cache/restore@v4
        with:
          path: verstuurd.json
          key: verstuurd-${{ github.run_id }}
          restore-keys: verstuurd-

      # Het logboek: elke setup en weigering met uitkomst (forward test), blijft van run tot run bewaard
      - uses: actions/cache/restore@v4
        with:
          path: logboek.json
          key: logboek-${{ github.run_id }}
          restore-keys: logboek-

      # Orderjournaal (broker.py): welke signalen al als order zijn verstuurd. Demo en live apart.
      - uses: actions/cache/restore@v4
        with:
          path: demo_staat.json
          key: demo-${{ github.run_id }}
          restore-keys: demo-

      - uses: actions/cache/restore@v4
        with:
          path: live_staat.json
          key: live-${{ github.run_id }}
          restore-keys: live-

      - name: Setups checken
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          # Orderuitvoering (broker.py). Demo is standaard; zonder deze geheimen gebeurt er niets.
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_DEMO_ACCOUNT_ID: ${{ secrets.CAPITAL_DEMO_ACCOUNT_ID }}
          # Live (echt geld): alleen actief als config.json, deze variabele EN alle live-geheimen kloppen (zie broker.py)
          CAPITAL_MODUS: ${{ vars.CAPITAL_MODUS }}
          CAPITAL_LIVE_BEVESTIGING: ${{ secrets.CAPITAL_LIVE_BEVESTIGING }}
          CAPITAL_LIVE_API_KEY: ${{ secrets.CAPITAL_LIVE_API_KEY }}
          CAPITAL_LIVE_IDENTIFIER: ${{ secrets.CAPITAL_LIVE_IDENTIFIER }}
          CAPITAL_LIVE_PASSWORD: ${{ secrets.CAPITAL_LIVE_PASSWORD }}
          CAPITAL_LIVE_ACCOUNT_ID: ${{ secrets.CAPITAL_LIVE_ACCOUNT_ID }}
          # Noodstop: de variabele NOODSTOP=1 werkt vanaf de volgende run. Direct (binnen ~3 min): "noodstop": true in config.json
          NOODSTOP: ${{ vars.NOODSTOP }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::NTFY_TOPIC ontbreekt: zet het onder Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python tradingstrategie.py --test-notify
            exit 0
          fi
          # elke minuut checken, ~5u40 lang (daarna neemt de volgende run het over)
          # config.json (de schakelaars uit het dashboard) en learned.json (leren.py) elke minuut opnieuw ophalen
          # elke 3 minuten: status.json en markt/*.json (koersen, candles, signalen) naar de branch "live" voor het dashboard
          last=-999
          while [ "$SECONDS" -lt 20400 ]; do
            git fetch -q origin "${{ github.ref_name }}" && git checkout -q FETCH_HEAD -- config.json 2>/dev/null || true
            git checkout -q FETCH_HEAD -- learned.json leren_geschiedenis.json lab.json 2>/dev/null || true   # keuzes van leren.py en het lab
            git checkout -q FETCH_HEAD -- NOODSTOP 2>/dev/null || rm -f NOODSTOP    # noodstop-bestand: elke minuut volgen
            python -W ignore tradingstrategie.py --once || true
            if [ $((SECONDS - last)) -ge 180 ]; then
              last=$SECONDS
              d=$(mktemp -d)
              if python -W ignore live_status.py --uit "$d/status.json"; then
                python -W ignore broker.py --status "$d/status.json" --uit "$d/demo.json" || true
                (cd "$d" && git init -q -b live && git add -A \
                  && git -c user.name="MarketPilot-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Live status" \
                  && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" live) || echo "Status pushen mislukt"
              fi
              rm -rf "$d"
            fi
            sleep 60
          done

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: verstuurd.json
          key: verstuurd-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('demo_staat.json') != ''
        with:
          path: demo_staat.json
          key: demo-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('live_staat.json') != ''
        with:
          path: live_staat.json
          key: live-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('logboek.json') != ''
        with:
          path: logboek.json
          key: logboek-${{ github.run_id }}

      # Logboek downloaden: Actions > een run > Artifacts > logboek (daarna: python tradingstrategie.py --logboek logboek.json)
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('logboek.json') != ''
        with:
          name: logboek
          path: logboek.json
          retention-days: 30

      - name: Volgende run starten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/tradingstrategie.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"test_notify":"false"}}'
