# Draait TradingStrategie in de cloud (GitHub Actions), elke 5 minuten tijdens de sessies.
# Meldingen gaan naar je telefoon via ntfy. Zet het ntfy-onderwerp als geheim NTFY_TOPIC
# (Settings > Secrets and variables > Actions > New repository secret).
name: TradingStrategie

on:
  schedule:
    # UTC-tijden; dekt London, NY AM en NY PM in zomer- en wintertijd
    - cron: "*/5 6-10,13-21 * * 1-5"
  workflow_dispatch: {}   # handmatig starten via de knop "Run workflow"

concurrency:
  group: tradingstrategie
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Binnen een sessie?
        id: window
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          hm = now.strftime("%H:%M")
          sess = [("02:00", "05:20"), ("09:30", "11:50"), ("13:30", "15:50")]
          ok = now.weekday() < 5 and any(a <= hm <= b for a, b in sess)
          print("run=" + ("true" if ok else "false"))
          PY

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"
          cache: pip

      - name: Onderdelen installeren
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      # Onthoudt welke meldingen al verstuurd zijn, zodat je er niet twee keer een krijgt
      - uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: verstuurd.json
          key: verstuurd-${{ github.run_id }}
          restore-keys: verstuurd-

      - name: Setups checken
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tradingstrategie.py --test-notify
          fi
          python tradingstrategie.py --once

      - uses: actions/cache/save@v4
        if: always() && (steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        with:
          path: verstuurd.json
          key: verstuurd-${{ github.run_id }}
