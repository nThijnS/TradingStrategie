# Draait de tests (risicologica, orderuitvoering met een nep-broker, lab-statistiek) bij elke wijziging in de code.
# Plaatst nooit orders en gebruikt geen geheimen.
name: Tests

on:
  push:
    paths: ["**.py", ".github/workflows/tests.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -W ignore -m unittest discover -s tests -v
