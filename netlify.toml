# Netlify-webapp van MarketPilot. Alles staat in web/; zie web/README.md.
# Publiceert alleen web/public, dus geen data of code uit de rest van de repository.
[build]
  publish = "web/public"
  functions = "web/netlify/functions"
  command = "cd web && npm test"
  # Elke productie-deploy kost 15 credits, dus alleen bouwen als de app zelf veranderd is.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- web netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
