<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TradingStrategie Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: sticky top bar with six sections (bottom tab bar on phones); each section is one column of
   decision-first blocks: summary tiles, then charts, then tables. Dark terminal look, light variant for daylight. */
:root {
  --bg: #0d1114; --panel: #151b20; --panel2: #1b232a; --line: #26313a; --fg: #e6ecef; --muted: #8a9aa6;
  --accent: #5fb3c9; --long: #3ecf8e; --short: #ff6b6b; --warn: #f2b84b; --idle: #5d6b75;
  --long-bg: rgba(62,207,142,.12); --short-bg: rgba(255,107,107,.12); --warn-bg: rgba(242,184,75,.13); --accent-bg: rgba(95,179,201,.12);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f5f6; --panel: #ffffff; --panel2: #eef2f4; --line: #d9e0e4; --fg: #14202a; --muted: #5b6b77;
  --accent: #1f7f99; --long: #128a57; --short: #c93c3c; --warn: #a86d00; --idle: #8796a1;
  --long-bg: rgba(18,138,87,.09); --short-bg: rgba(201,60,60,.09); --warn-bg: rgba(168,109,0,.1); --accent-bg: rgba(31,127,153,.09);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f3f5f6; --panel: #ffffff; --panel2: #eef2f4; --line: #d9e0e4; --fg: #14202a; --muted: #5b6b77;
  --accent: #1f7f99; --long: #128a57; --short: #c93c3c; --warn: #a86d00; --idle: #8796a1;
  --long-bg: rgba(18,138,87,.09); --short-bg: rgba(201,60,60,.09); --warn-bg: rgba(168,109,0,.1); --accent-bg: rgba(31,127,153,.09);
  color-scheme: light; }

* { box-sizing: border-box }
html, body { background: var(--bg) }
body { margin: 0; color: var(--fg); font: 15px/1.5 var(--body); padding-bottom: 80px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1180px; margin: 0 auto }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
h1 { font-size: 1.15rem } h2 { font-size: 1.3rem } h3 { font-size: 1.05rem }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) } .small { font-size: .82rem }
.label { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
a { color: var(--accent) }
.up { color: var(--long) } .down { color: var(--short) } .warn { color: var(--warn) }

/* top bar + navigation */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line) }
.bar .wrap { display: flex; align-items: center; gap: 18px; min-height: 56px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); transform: rotate(45deg) }
nav.tabs { display: flex; gap: 2px }
nav.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .88rem; padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; gap: 7px }
nav.tabs a svg { width: 16px; height: 16px; flex: none }
nav.tabs a.on { color: var(--fg); background: var(--accent-bg) }
nav.tabs a:hover { color: var(--fg) }
.barinfo { display: flex; gap: 8px; align-items: center }
@media (max-width: 860px) {
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line);
    padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); justify-content: space-around }
  nav.tabs a { flex-direction: column; gap: 2px; font-size: .64rem; padding: 6px 4px; flex: 1; text-align: center }
  nav.tabs a svg { width: 20px; height: 20px }
}

main { padding-block: 22px }
.page { display: grid; gap: 26px }
.page[hidden] { display: none !important }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; font-size: .9rem }
section { display: grid; gap: 12px; min-width: 0 }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0 }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)) }
.grid.sm { grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)) }
.cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)) }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: .76rem; font-weight: 600; white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.pill.nodot::before { display: none }
.p-ok { color: var(--long); background: var(--long-bg) } .p-warn { color: var(--warn); background: var(--warn-bg) }
.p-bad { color: var(--short); background: var(--short-bg) } .p-idle { color: var(--muted); background: var(--panel2) }
.p-acc { color: var(--accent); background: var(--accent-bg) }

/* hero + KPI tiles */
.hero { display: grid; gap: 10px }
.hero .big { font-family: var(--display); font-size: clamp(1.3rem, 3vw, 1.75rem); font-weight: 700; line-height: 1.2 }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px }
.kpi .v { font-family: var(--mono); font-size: 1.35rem; font-weight: 600 }
.kpi .d { font-size: .76rem; color: var(--muted) }
.sessbar { display: flex; gap: 8px; flex-wrap: wrap }
.sess { font-size: .78rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted) }
.sess.on { border-color: var(--accent); color: var(--accent); font-weight: 600 }

/* signal cards */
.trade { display: grid; gap: 12px; border-top: 4px solid var(--idle) }
.trade.LONG { border-top-color: var(--long) } .trade.SHORT { border-top-color: var(--short) }
.trade.info { opacity: .7 }
.trade-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px }
.side-LONG { color: var(--long) } .side-SHORT { color: var(--short) }
.lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.lv div { background: var(--bg); border-radius: 10px; padding: 8px 10px; min-width: 0 }
.lv .v { font-family: var(--mono); font-weight: 600; font-size: .92rem; white-space: nowrap }
.lv .d { font-size: .72rem; color: var(--muted) }
.size { background: var(--accent-bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px }
.size .v { font-family: var(--mono); font-weight: 600; font-size: 1.02rem; color: var(--accent) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-size: .72rem; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--muted) }
.chip.ok { color: var(--long) } .chip.no { text-decoration: line-through }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 6px; background: transparent }

/* market tiles */
.tile { display: grid; gap: 8px; cursor: pointer; text-decoration: none; color: inherit; transition: border-color .15s }
.tile:hover, .tile:focus-visible { border-color: var(--accent) }
.tile-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start }
.price { font-family: var(--mono); font-size: 1.25rem; font-weight: 600 }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font-size: .72rem; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted) }
.tag.trend-Uptrend { color: var(--long); border-color: currentColor } .tag.trend-Downtrend { color: var(--short); border-color: currentColor }
.tag.vol-Hoge { color: var(--warn); border-color: currentColor }
.filters { display: flex; gap: 6px; flex-wrap: wrap }
button, .btn { font: 600 .82rem var(--body); color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none }
button.on, .btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-bg) }
button:hover { color: var(--fg) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* charts */
.chartbox { height: 400px; position: relative; border-radius: 10px; overflow: hidden }
.chartbox.sm { height: 230px } .chartbox.xs { height: 160px }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--muted) }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px dashed; vertical-align: middle; margin-right: 5px }

/* tables */
.tbl { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: .84rem }
th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
td.n, th.n { text-align: right; font-family: var(--mono); white-space: nowrap }
tr.sel td { background: var(--accent-bg) }
tr.link { cursor: pointer } tr.link:hover td { background: var(--panel2) }
.barcell { position: relative; height: 14px; min-width: 120px; background: var(--panel2); border-radius: 4px }
.barcell .b { position: absolute; top: 2px; height: 10px; border-radius: 3px }
.barcell .z { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted) }
.barcell .ci { position: absolute; top: 6px; height: 2px; background: var(--fg); opacity: .5 }

/* stats */
.stats { display: grid; gap: 1px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.stat { background: var(--panel); padding: 10px 12px; display: grid; gap: 2px }
.stat .v { font-family: var(--mono); font-size: 1.05rem; font-weight: 600 }
.verdict { font-size: .88rem; padding: 10px 12px; border-radius: 10px; background: var(--panel2) }
.verdict.bad { color: var(--short) } .verdict.meh { color: var(--warn) } .verdict.good { color: var(--long) }

/* timeline */
.tl { display: grid; border-left: 2px solid var(--line); margin-left: 6px }
.tl-item { position: relative; padding: 0 0 22px 20px; display: grid; gap: 8px; min-width: 0 }
.tl-item::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent) }
details > summary { cursor: pointer; color: var(--accent); font-size: .86rem; font-weight: 600 }
details[open] > summary { margin-bottom: 8px }

/* forms */
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)) }
.form label { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); font-weight: 500 }
input, select { font: 500 .92rem var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0 }
select { font-family: var(--body) }
td input { padding: 5px 7px; font-size: .84rem; min-width: 80px }

.err { background: var(--short-bg); color: var(--short); border-radius: 12px; padding: 12px 14px; font-size: .9rem }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-size: .9rem }
.note { font-size: .8rem; color: var(--muted); max-width: 80ch }
.term { border-bottom: 1px dotted var(--muted); cursor: help }
.gloss { display: grid; gap: 6px; font-size: .84rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)) }
.gloss div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
.back { text-decoration: none; font-weight: 600; font-size: .86rem }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

  <div class="wrap">

<script>
"use strict";
const REPO = "nThijnS/TradingStrategie";
const LIVE = /github\.io$/.test(location.hostname);
const RAW = `https://raw.githubusercontent.com/${REPO}`;
const URLS = {
  status: LIVE ? `${RAW}/live/status.json` : "status.json",
  lab: LIVE ? `${RAW}/main/lab.json` : "lab.json",
  hist: LIVE ? `${RAW}/main/lab_geschiedenis.json` : "lab_geschiedenis.json",
  markt: n => LIVE ? `${RAW}/live/markt/${n}.json` : `markt/${n}.json`,
};
const SOORT = { crypto: "Crypto", forex: "Forex", index: "Indices", grondstof: "Grondstoffen", aandeel: "Aandelen" };
const GLOSS = {
  "R": "Je risico per trade. 1R verliezen = je stop is geraakt. +2R = twee keer je risico gewonnen.",
  "Verwachte opbrengst": "Gemiddeld resultaat per trade in R (expectancy). Boven 0 = de strategie verdient gemiddeld geld.",
  "Ondergrens": "Verwachte opbrengst min de onzekerheid (1 standaardfout). De bot kiest alleen strategieën waarvan dit boven 0 ligt.",
  "Nieuwe data": "Out-of-sample: trades in periodes die de strategie bij het kiezen nog niet had gezien (walk-forward). Dit is de eerlijke test.",
  "Oude data": "In-sample: de beste variant achteraf gekozen op alle data. Ziet er altijd beter uit dan het is.",
  "Walk-forward": "Kies de beste variant op 240 dagen, test die op de 60 dagen erna, schuif op en herhaal. Zo telt alleen wat op onbekende data gebeurde.",
  "Profit factor": "Totale winst gedeeld door totaal verlies. Boven 1 = winstgevend, boven 1,5 = sterk.",
  "Drawdown": "Het grootste verlies vanaf een eerdere top, in R. Belangrijk voor de verlieslimieten van je prop firm.",
  "Marktconditie": "Trend (prijs beweegt efficiënt één kant op), zijwaarts (heen en weer) en hoe groot de beweging is vergeleken met het afgelopen jaar.",
  "95%-interval": "Waar de echte verwachte opbrengst met 95% zekerheid ligt. Loopt dit door 0 heen, dan is niet bewezen dat de strategie werkt.",
};
const STATUS_TXT = { live: "live", vertraagd: "vertraagd", dicht: "markt dicht", storing: "storing" };
const STATUS_CLS = { live: "p-ok", vertraagd: "p-warn", dicht: "p-idle", storing: "p-bad" };

let S = null, L = null, H = [], MCACHE = {}, ERR = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = (v, d = 2) => v == null || !isFinite(v) ? "–" : Number(v).toLocaleString("nl-NL", { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (v, d = 2) => v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v), d);
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const tz = { timeZone: "Europe/Amsterdam" };
const nlTime = iso => new Date(iso).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit", ...tz });
const nlDate = iso => new Date(iso).toLocaleDateString("nl-NL", { day: "numeric", month: "short", ...(new Date(iso).getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}), ...tz });
const nlDT = iso => new Date(iso).toLocaleString("nl-NL", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", ...tz });
const ago = iso => { if (!iso) return "onbekend"; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "net" : m < 60 ? `${m} min geleden` : m < 1440 ? `${Math.round(m / 60)} uur geleden` : `${Math.round(m / 1440)} dagen geleden` };
const term = (t, label) => `<span class="term" title="${esc(GLOSS[t] || "")}">${esc(label || t)}</span>`;
const LM = n => L?.markten?.find(m => m.naam === n);
const SM = n => S?.alle_markten?.find(m => m.naam === n);
const IM = n => S?.markten?.find(m => m.naam === n);
const titel = n => SM(n)?.titel || LM(n)?.titel || n;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------------- Risk settings (bewaard op dit apparaat) ---------------- */
// v = waarde van 1,0 prijsbeweging per lot in valuta ccy; step = kleinste ordergrootte; comm = commissie per lot heen+terug (in ccy);
// spread in prijs-eenheden
const INST = {
  BTC: { label: "BTCUSD CFD (1 lot = 1 BTC)", v: 1, ccy: "USD", step: 0.01, comm: 0, spread: 20 },
  ETH: { label: "ETHUSD CFD (1 lot = 1 ETH)", v: 1, ccy: "USD", step: 0.01, comm: 0, spread: 1.5 },
  SOL: { label: "SOLUSD CFD (1 lot = 1 SOL)", v: 1, ccy: "USD", step: 0.1, comm: 0, spread: 0.1 },
  EURUSD: { label: "Forex (1 lot = 100.000)", v: 100000, ccy: "USD", step: 0.01, comm: 5, spread: 0.00005 },
  GBPUSD: { label: "Forex (1 lot = 100.000)", v: 100000, ccy: "USD", step: 0.01, comm: 5, spread: 0.00008 },
  USDJPY: { label: "Forex (1 lot = 100.000, winst in yen)", v: 100000, ccy: "JPY", step: 0.01, comm: 5, spread: 0.008 },
  NQ: { label: "US100 CFD ($1 per punt)", v: 1, ccy: "USD", step: 0.01, comm: 0, spread: 1.5, presets: [["US100 CFD ($1 per punt)", 1, 0.01], ["MNQ micro future ($2 per punt)", 2, 1], ["NQ future ($20 per punt)", 20, 1]] },
  ES: { label: "US500 CFD ($1 per punt)", v: 1, ccy: "USD", step: 0.01, comm: 0, spread: 0.5, presets: [["US500 CFD ($1 per punt)", 1, 0.01], ["MES micro future ($5 per punt)", 5, 1], ["ES future ($50 per punt)", 50, 1]] },

function learnSummary(h) {
  const ms = Object.entries(h.markten);

  const sw = ms.filter(([, v]) => v.gewisseld);
  return `<div class="small" style="display:grid;gap:6px">
    <div>${nlDT(h.t)}: <b>${ms.length} markten</b> geanalyseerd, per markt ${Math.max(0, ...ms.map(([, v]) => v.getest.length))} soorten strategieën met hun varianten.</div>
    <div>Gekozen: ${chosen.length ? chosen.map(([k, v]) => `<b>${esc(titel(k))}</b> → ${esc(v.keuze)}`).join(", ") : "geen enkele markt"}; de rest: geen trade.</div>
    <div>${sw.length ? `Veranderd: ${sw.map(([k, v]) => `${esc(titel(k))} (${esc(v.keuze)})`).join(", ")}.` : "Niets veranderd."}</div></div>`;
}

        <div class="small">Geen trade: <b class="num">0R</b> (de bot kiest dit als niets beter is)</div>
        <div class="small">Kopen en vasthouden: <b class="num">${sgn(lm.benchmark?.kopen_houden_pct, 1)}%</b> in dezelfde periode</div>
        <div class="small">Deze strategie: <b class="num ${nw.netto > 0 ? "up" : "down"}">${sgn(nw.netto, 1)}R</b>; bij ${nf(P.risk, 2)}% risico per trade ≈ <b class="num">${sgn((nw.netto || 0) * P.risk, 1)}%</b> op je account</div>
        <div class="small">Beste andere: ${(() => { const o = sorted.find(s => s.id !== st.id); return o ? `${esc(o.titel)} ${sgn(o.nieuw.netto, 1)}R` : "–" })()}</div></div>
    </div>`;
  $("pm").onchange = e => { PERF.m = e.target.value; PERF.s = null; rPerformance() };
  $("ps").onchange = e => { PERF.s = e.target.value; rPerformance() };
  $("p-performance").querySelectorAll("[data-m]").forEach(r => r.onclick = () => { PERF.m = r.dataset.m; PERF.s = null; rPerformance() });
  drawPerf(lm, st);
}
function uniqTimes(arr) { let last = -Infinity; return arr.map(([t, v]) => { t = Math.max(t, last + 1); last = t; return { time: t, value: v } }) }
function drawPerf(lm, st) {
  if (!window.LightweightCharts) return;
  const tr = st.nieuw.trades || [];
  const mk = id => { const c = LightweightCharts.createChart($(id), { ...chartOpts(230), timeScale: { borderColor: css("--line"), timeVisible: false } }); PCH.push(c); return c };
  let cum = 0, peak = 0;
  const eq = [], dd = [];
  for (const [t, r] of tr) { cum += r; peak = Math.max(peak, cum); eq.push([t, +cum.toFixed(3)]); dd.push([t, +(cum - peak).toFixed(3)]) }
  if (!tr.length) ["c-eq", "c-dd", "c-mo"].forEach(id => $(id).innerHTML = `<div class="empty" style="height:100%">Geen trades</div>`);
  else {
    const c1 = mk("c-eq"); c1.addAreaSeries({ lineColor: css("--accent"), topColor: "rgba(95,179,201,.35)", bottomColor: "rgba(95,179,201,.02)", lineWidth: 2 }).setData(uniqTimes(eq)); c1.timeScale().fitContent();
    const c2 = mk("c-dd"); c2.addBaselineSeries({ baseValue: { type: "price", price: 0 }, topLineColor: css("--short"), bottomLineColor: css("--short"), topFillColor1: "rgba(0,0,0,0)", topFillColor2: "rgba(0,0,0,0)",
      bottomFillColor1: "rgba(255,107,107,.08)", bottomFillColor2: "rgba(255,107,107,.4)", lineWidth: 1 }).setData(uniqTimes(dd)); c2.timeScale().fitContent();
    const c3 = mk("c-mo");
    c3.addHistogramSeries({ priceFormat: { type: "price", precision: 1, minMove: 0.1 } }).setData(Object.entries(st.nieuw.per_maand || {}).map(([k, v]) => ({ time: k + "-01", value: v[1], color: v[1] >= 0 ? css("--long") : css("--short") })));
    c3.timeScale().fitContent();
  }
  const c4 = mk("c-all"), pal = [css("--accent"), css("--long"), css("--warn"), css("--short"), "#a78bfa", css("--muted")];
  const leg = [];
  lm.strategieen.forEach((s, i) => {
    const t = s.nieuw.trades || []; if (!t.length) return;
    let c = 0; const pts = t.map(([ts, r]) => [ts, +(c += r).toFixed(3)]);
    c4.addLineSeries({ color: pal[i % pal.length], lineWidth: s.id === st.id ? 3 : 1, priceLineVisible: false, lastValueVisible: false }).setData(uniqTimes(pts));
    leg.push(`<span style="color:${pal[i % pal.length]}">● ${esc(s.titel)} ${sgn(s.nieuw.netto, 0)}R</span>`);
  });
  c4.timeScale().fitContent(); $("c-all-leg").innerHTML = leg.join("");
}

/* ---------------- Risk ---------------- */
function rRisk() {
  const ms = S?.alle_markten || [];
  const open = allSignals().filter(s => LIVE_ST.includes(s.status) && s.telt);
  const exposure = open.reduce((a, s) => a + sizing(s.n, s.entry, s.stop).real, 0);
  const riskUSD = P.acc * P.risk / 100 * rate(P.ccy);
  const dayLeft = (P.acc * P.dll / 100 - P.lossToday) * rate(P.ccy);
  const expMax = P.acc * P.exp / 100 * rate(P.ccy);
  $("p-risk").innerHTML = `
    <div class="head"><div><h2>Risk Center</h2><p>Stel je prop-account in. Alle signalen rekenen daarmee je positiegrootte uit. Wordt alleen op dit apparaat bewaard.</p></div></div>
    <div class="card" style="display:grid;gap:14px">
      <div class="form">
        <label for="r-acc">Accountgrootte<input id="r-acc" type="number" min="0" step="1000" value="${P.acc}"></label>
        <label for="r-ccy">Valuta account<select id="r-ccy"><option value="USD" ${P.ccy === "USD" ? "selected" : ""}>Dollar ($)</option><option value="EUR" ${P.ccy === "EUR" ? "selected" : ""}>Euro (€)</option></select></label>
        <label for="r-risk">Risico per trade (%)<input id="r-risk" type="number" min="0" step="0.05" value="${P.risk}"></label>
        <label for="r-dll">Max verlies per dag (%)<input id="r-dll" type="number" min="0" step="0.5" value="${P.dll}"></label>
        <label for="r-mdd">Max verlies totaal (%)<input id="r-mdd" type="number" min="0" step="0.5" value="${P.mdd}"></label>
        <label for="r-exp">Max open risico samen (%)<input id="r-exp" type="number" min="0" step="0.25" value="${P.exp}"></label>
        <label for="r-lt">Verlies vandaag al (${accSym()})<input id="r-lt" type="number" min="0" step="10" value="${P.lossToday}"></label>
      </div>
      <div class="kpis">
        <div class="kpi"><span class="label">Risico per trade</span><span class="v">${money(riskUSD)}</span></div>
        <div class="kpi"><span class="label">Ruimte vandaag</span><span class="v ${dayLeft < riskUSD ? "down" : ""}">${money(Math.max(0, dayLeft))}</span><span class="d">${riskUSD ? Math.max(0, Math.floor(dayLeft / riskUSD)) : "–"} verliezende trades</span></div>
        <div class="kpi"><span class="label">Tot totaallimiet</span><span class="v">${P.risk ? Math.floor(P.mdd / P.risk) : "–"}</span><span class="d">verliezende trades op rij</span></div>
        <div class="kpi"><span class="label">Nu open risico</span><span class="v ${exposure > expMax ? "down" : ""}">${money(exposure)}</span><span class="d">max ${money(expMax)} · ${open.length} signalen</span></div>
      </div>
      ${exposure > expMax ? `<div class="warnbox">Neem je alle open signalen, dan riskeer je ${money(exposure)}: meer dan je maximum van ${money(expMax)}. Neem er minder of verklein je risico per trade.</div>` : ""}
      ${dayLeft < riskUSD ? `<div class="err">Je dagruimte is kleiner dan één trade. Stop voor vandaag.</div>` : ""}
      <div class="muted small">Wisselkoersen uit de live data: EUR/USD ${nf(rate("EUR"), 4)}, USD/JPY ${nf(1 / rate("JPY"), 2)}. Lotgrootte = risico ÷ ((afstand tot stop + spread) × waarde per punt + commissie).</div>
    </div>
    <section><h2>Instrumenten</h2>
      <div class="warnbox small">Contractgrootte, waarde per punt, spread en commissie verschillen per broker en prop firm. Controleer ze in je platform (contract specifications) en pas ze hier aan.</div>
      <div class="card tbl"><table><thead><tr><th>Markt</th><th>Type</th><th class="n">Waarde per 1,0 beweging per lot</th><th>Valuta</th><th class="n">Kleinste positie</th><th class="n">Spread (prijs)</th><th class="n">Commissie per lot</th><th></th></tr></thead><tbody>
      ${ms.map(m => { const I = inst(m.naam);
        return `<tr><td><b>${esc(m.titel)}</b></td>
        <td>${I.presets ? `<select id="pr-${m.naam}" data-k="${m.naam}" data-f="preset">${I.presets.map(p => `<option ${p[0] === I.label ? "selected" : ""}>${esc(p[0])}</option>`).join("")}</select>` : `<span class="small">${esc(I.label)}</span>`}</td>
        <td class="n"><input id="v-${m.naam}" aria-label="waarde ${esc(m.titel)}" data-k="${m.naam}" data-f="v" type="number" step="any" value="${I.v}"></td><td>${esc(I.ccy)}</td>
        <td class="n"><input id="st-${m.naam}" aria-label="kleinste positie ${esc(m.titel)}" data-k="${m.naam}" data-f="step" type="number" step="any" value="${I.step}"></td>
        <td class="n"><input id="sp-${m.naam}" aria-label="spread ${esc(m.titel)}" data-k="${m.naam}" data-f="spread" type="number" step="any" value="${I.spread}"></td>
        <td class="n"><input id="cm-${m.naam}" aria-label="commissie ${esc(m.titel)}" data-k="${m.naam}" data-f="comm" type="number" step="any" value="${I.comm}"></td>
        <td>${P.inst[m.naam] ? `<button type="button" data-reset="${m.naam}">standaard</button>` : ""}</td></tr>` }).join("")}
      </tbody></table></div></section>
    <section><h2>Rekenhulp</h2><div class="card" style="display:grid;gap:12px">
      <div class="form">
        <label for="c-m">Markt<select id="c-m">${ms.map(m => `<option value="${m.naam}">${esc(m.titel)}</option>`).join("")}</select></label>
        <label for="c-e">Instap<input id="c-e" type="number" step="any"></label>
        <label for="c-s">Stop<input id="c-s" type="number" step="any"></label></div>
      <div id="c-out" class="size"></div></div></section>
    <section><h2>Begrippen</h2><div class="gloss">${Object.entries(GLOSS).map(([k, v]) => `<div><b>${esc(k)}</b><br><span class="muted">${esc(v)}</span></div>`).join("")}</div></section>`;
  const num = (id, k) => $(id).addEventListener("change", () => { const v = parseFloat($(id).value); if (!isNaN(v) && v >= 0) { P[k] = v; saveP(); rRisk() } });
  [["r-acc", "acc"], ["r-risk", "risk"], ["r-dll", "dll"], ["r-mdd", "mdd"], ["r-exp", "exp"], ["r-lt", "lossToday"]].forEach(a => num(...a));
  $("r-ccy").onchange = e => { P.ccy = e.target.value; saveP(); rRisk() };
  $("p-risk").querySelectorAll("[data-k]").forEach(el => el.addEventListener("change", () => {
    const k = el.dataset.k, f = el.dataset.f; P.inst[k] = P.inst[k] || {};
    if (f === "preset") { const p = INST[k].presets.find(x => x[0] === el.value); Object.assign(P.inst[k], { label: p[0], v: p[1], step: p[2] }) }
    else { const v = parseFloat(el.value); if (!isNaN(v) && v >= 0) P.inst[k][f] = v }
    saveP(); rRisk();
  }));
  $("p-risk").querySelectorAll("[data-reset]").forEach(b => b.onclick = () => { delete P.inst[b.dataset.reset]; saveP(); rRisk() });
  const calc = () => {
    const n = $("c-m").value, e = parseFloat($("c-e").value), s = parseFloat($("c-s").value);
    if (!isFinite(e) || !isFinite(s) || e === s) { $("c-out").innerHTML = `<span class="muted small">Vul een instap en stop in.</span>`; return }
    const z = sizing(n, e, s);
    $("c-out").innerHTML = `<div class="label">${esc(z.I.label)}</div><div class="v">${z.lots > 0 ? nf(z.lots, z.I.step < 1 ? 2 : 0) + (z.I.step < 1 ? " lot" : " stuks/contracten") : "te klein"}</div><div class="small">Risico ${money(z.real)} (doel ${money(z.riskUSD)}), waarvan kosten ${money(z.costUSD)}</div>`;
  };
  const first = open[0];
  if (first) { $("c-m").value = first.n; $("c-e").value = first.entry; $("c-s").value = first.stop }
  ["c-m", "c-e", "c-s"].forEach(id => $(id).addEventListener("input", calc)); calc();
}

/* ---------------- Laden en navigeren ---------------- */
async function getJSON(u, bust) {
  const r = await fetch(u + (LIVE && bust ? `?t=${Date.now()}` : ""), { cache: "no-store" });
  if (!r.ok) throw new Error(`${u.split("/").pop()}: ${r.status}`);
  return r.json();
}
async function load() {
  ERR = [];
  const [s, l, h] = await Promise.allSettled([getJSON(URLS.status, true), getJSON(URLS.lab, true), getJSON(URLS.hist, true)]);
  if (s.status === "fulfilled") S = s.value; else ERR.push("live status niet op te halen (" + s.reason.message + ")");
  if (l.status === "fulfilled") L = l.value; else ERR.push("labresultaten niet op te halen (" + l.reason.message + ")");
  if (h.status === "fulfilled") H = h.value; else ERR.push("leergeschiedenis niet op te halen");
  MCACHE = {};
  $("error").hidden = !ERR.length;
  $("error").textContent = ERR.length ? "Let op: " + ERR.join("; ") + "." + (LIVE ? " Draait de cloud-keten nog? Kijk bij GitHub > Actions." : "") : "";
  route(true);
}
function header() {
  const f = $("fresh");
  if (!S) { f.className = "pill p-bad"; f.textContent = "geen data"; return }
  const age = (Date.now() - new Date(S.gemaakt)) / 60000;
  f.className = "pill " + (!LIVE ? "p-idle" : age < 10 ? "p-ok" : age < 30 ? "p-warn" : "p-bad");
  f.textContent = `ververst ${ago(S.gemaakt)}`;
  $("mode").innerHTML = LIVE ? "Live: data elke 3 minuten vanuit de cloud. Alleen analyse en papertrades."
    : `Momentopname van ${esc(nlDT(S.gemaakt))}. <a href="https://nthijns.github.io/TradingStrategie/" target="_blank" rel="noopener">Open de live versie</a>`;
}
const RENDER = { dashboard: rDashboard, markets: rMarkets, learning: rLearning, datafarm: rDatafarm, performance: rPerformance, risk: rRisk };
let CUR = null;
function route(force) {
  const h = location.hash.slice(1) || "dashboard";
  const page = h.startsWith("markt-") ? "markets" : (RENDER[h] ? h : "dashboard"), sub = h.startsWith("markt-") ? h.slice(6) : null;
  const key = page + (sub || "");
  document.querySelectorAll(".page").forEach(p => p.hidden = p.id !== "p-" + page);
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.p === page));
  header();
  if (!force && key === CUR) return;
  if (key !== CUR) window.scrollTo(0, 0);
  CUR = key;
  // invulvelden niet onder je vingers verversen
  if (force && page === "risk" && document.activeElement?.closest?.("#p-risk")) return;
  try { RENDER[page](sub) } catch (e) { $("p-" + page).innerHTML = `<div class="err">Dit onderdeel kon niet worden getoond (${esc(e.message)}).</div>`; console.error(e) }
}
window.addEventListener("hashchange", () => route(false));
$("reload").addEventListener("click", load);
load();
if (LIVE) setInterval(load, 3 * 60000);
setInterval(header, 30000);
</script>
